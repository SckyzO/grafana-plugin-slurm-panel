name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# There is deliberately no actions/setup-node and no pnpm/action-setup below.
# Every command runs through `make`, inside the image built from
# dev/Dockerfile.toolchain — the same image a contributor gets. A runner that
# installed its own Node would be a second toolchain, and a second toolchain
# is the thing that drifts.
jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: ids
        name: Read the runner's uid and gid
        # The image is built for whoever runs it so the files the container
        # leaves in the checkout stay writable by the following steps. The
        # runner is not uid 1000, so this cannot be left to the default.
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: dev
          file: dev/Dockerfile.toolchain
          tags: slurm-views-tools:local
          load: true
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # lint, typecheck, test, build, and the React 19 compatibility scan.
      - run: make check

  resolve-versions:
    name: Resolve Grafana e2e versions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: resolve-versions
        uses: grafana/plugin-actions/e2e-version@main
        with:
          # The plugin lives in a monorepo subdirectory; the action reads
          # grafanaDependency from its plugin.json, not the repo root's.
          plugin-directory: plugins/nodegrid-panel
      - name: Guard against an empty matrix
        # A matrix with zero entries makes the e2e job report success without
        # running a single test - the exact failure mode this matrix exists
        # to prevent. Fail loudly instead of shipping that silently.
        run: |
          count=$(echo '${{ steps.resolve-versions.outputs.matrix }}' | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::grafana/plugin-actions/e2e-version resolved zero Grafana versions."
            exit 1
          fi

  e2e:
    name: e2e ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.VERSION }}
    needs: [build, resolve-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{ fromJson(needs.resolve-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: dev
          file: dev/Dockerfile.toolchain
          tags: slurm-views-tools:local
          load: true
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the browser tests
        # GRAFANA_VERSION and GRAFANA_IMAGE are the same two variables
        # dev/docker-compose.yml reads locally; this matrix is what catches a
        # break on a new Grafana before a user does. `make e2e` builds the
        # plugin, starts the stack and waits for Grafana itself, so there is
        # nothing here that a contributor does not also run.
        env:
          GRAFANA_VERSION: ${{ matrix.GRAFANA_IMAGE.VERSION }}
          GRAFANA_IMAGE: ${{ matrix.GRAFANA_IMAGE.NAME }}
        run: make e2e

      - name: Dump Grafana logs
        if: ${{ failure() }}
        run: make logs-once

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.GRAFANA_IMAGE.VERSION }}
          path: plugins/nodegrid-panel/playwright-report/
          retention-days: 7

      - name: Stop the stack
        if: ${{ always() }}
        run: make down
