apiVersion: 1
providers:
  - name: slurm-views
    folder: Slurm
    # Pinned, not derived. Without a folderUid Grafana identifies the folder by
    # its title and gives it a generated uid, so renaming it makes a second
    # folder and moves every link that carried the old one. Each dashboard JSON
    # pins its own uid for the same reason; this is the one that was missing.
    folderUid: slurm-views
    type: file
    # Editable from the browser, and saves persist.
    #
    # Grafana's rule: with allowUiUpdates true a save is written to Grafana's
    # own database, and the file wins again the next time the file changes -
    # "regardless of version numbers", so an edit here silently discards
    # whatever was saved in the UI for that dashboard.
    #
    # The trap is not the save, it is the export. Saving materialises every
    # default the panel supplies into the dashboard's JSON, so an export
    # pasted back into this directory freezes them: one did exactly that to
    # the plugin's value mappings, which then kept reporting six Slurm states
    # as unmapped after the plugin had learned them. When copying a change
    # back, take the panel or the option that changed - not the whole export.
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
