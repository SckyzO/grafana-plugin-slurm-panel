# The project name is set explicitly. Left to Docker it would be taken from
# this file's parent directory — `dev` — which is neither unique on a machine
# that hosts more than one repository nor recognisable in `docker compose ls`.
name: slurm-views

services:
  grafana:
    # Pinned, never floating. `docker compose up -d` does not recreate a
    # running container when a tag moves, so a floating tag silently does not
    # move — slurm_exporter's own stack sat on 12.4.2 for nine days while
    # :latest was 13.2.1. A pinned version that is visibly bumped is honest.
    image: ${GRAFANA_IMAGE:-grafana/grafana}:${GRAFANA_VERSION:-13.2.1}
    ports:
      - '3001:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: 'true'
      GF_DEFAULT_APP_MODE: development
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: tomzone-slurmnodegrid-panel
    volumes:
      - ../plugins/nodegrid-panel/dist:/var/lib/grafana/plugins/tomzone-slurmnodegrid-panel
      - ./provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3.14.0
    # The default two flags, plus --web.enable-lifecycle: the generated
    # scrape file changes without the container changing (it is
    # bind-mounted), so `make scrape` has nothing to signal short of asking
    # this running process to re-read its config itself. Acceptable only
    # because this stack is dev-only and bound to localhost.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - '9091:9090'
    volumes:
      # The whole directory, not just prometheus.yml: scrape_config_files
      # points at /etc/prometheus/scrape/*.yml, generated by `make scrape`
      # from dev/relabel/racks.txt, and that directory has to be visible here
      # too for Prometheus to find it.
      - ./prometheus:/etc/prometheus:ro

  synthetic-exporter:
    build: ./synthetic-exporter
    environment:
      # Give RACKS with SYNTH_NODES_PER_RACK when the rack is the shape you
      # care about, or with SYNTH_NODES when the total is. Either way the
      # exporter produces exactly RACKS racks.
      RACKS: ${SYNTH_RACKS:-6}
      NODES_PER_RACK: ${SYNTH_NODES_PER_RACK:-0}
      NODES: ${SYNTH_NODES:-240}
      PARTITIONS: ${SYNTH_PARTITIONS:-cpu,gpu,debug}
      SEED: ${SYNTH_SEED:-1}

  tools:
    # The toolchain, not a long-running service: `profiles` keeps it out of
    # `docker compose up`, and `docker compose run` enables its profile on its
    # own. Driven through the Makefile — see the root README.
    profiles: ['tools']
    # Named explicitly rather than left to compose's project-derived default,
    # so CI can build this image once — with a layer cache — and have every
    # later `docker compose run` reuse it instead of rebuilding Chromium.
    image: slurm-views-tools:local
    build:
      context: .
      dockerfile: Dockerfile.toolchain
      args:
        # Written by the Makefile from `id -u` / `id -g` so the files the
        # container leaves in the source tree belong to the caller.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    init: true
    environment:
      # Inside the compose network Grafana answers on its own port. The 3001
      # mapping exists only for a browser on the host.
      GRAFANA_URL: ${GRAFANA_URL:-http://grafana:3000}
    volumes:
      - ..:/work
      # node_modules never touches the host. Named volumes rather than bind
      # mounts: the host stays clean, and pnpm's symlink tree is an order of
      # magnitude faster off the WSL2 9p bridge. One per workspace package,
      # because pnpm materialises a node_modules directory in each.
      - root-node-modules:/work/node_modules
      - core-node-modules:/work/packages/core/node_modules
      - panel-node-modules:/work/plugins/nodegrid-panel/node_modules
      - contract-node-modules:/work/tests/contract/node_modules
      - pnpm-store:/pnpm

  validator:
    # Grafana's official plugin validator. Pinned, and declared here rather
    # than run as `docker run grafana/plugin-validator-cli` from the Makefile,
    # for two reasons: an unpinned tag with --pull=always fetches whatever was
    # published most recently — at the time of writing, an image less than a
    # day old, well inside the three-day cooldown this project imposes on its
    # own dependencies — and a tag named in a Makefile is invisible to the
    # dependabot entry that watches every other image in this file.
    profiles: ['tools']
    image: grafana/plugin-validator-cli:v0.49.1
    volumes:
      - ../plugins/nodegrid-panel/.artifacts:/archive:ro

volumes:
  root-node-modules:
  core-node-modules:
  panel-node-modules:
  contract-node-modules:
  pnpm-store:
