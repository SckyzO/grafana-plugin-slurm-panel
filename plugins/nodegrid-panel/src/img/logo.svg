<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Slurm Node Grid">
  <title>Slurm Node Grid</title>
  <!--
    Three cabinets, three sleds each, one of them alive.

    Drawn for 16px first, which is the size the plugin catalogue actually
    lists it at: nine marks, none thinner than a tenth of the canvas, no
    gradient and no hairline. Mid-tone colours on purpose so it holds on both
    the light and the dark Grafana surface without a second file — the
    plugin.json logo entry points small and large at this one image.
  -->
  <g fill="#6e7a8a">
    <rect x="4"  y="12" width="16" height="9" rx="1.5"/>
    <rect x="4"  y="27" width="16" height="9" rx="1.5"/>
    <rect x="4"  y="42" width="16" height="9" rx="1.5"/>

    <rect x="24" y="12" width="16" height="9" rx="1.5"/>
    <rect x="24" y="42" width="16" height="9" rx="1.5"/>

    <rect x="44" y="12" width="16" height="9" rx="1.5"/>
    <rect x="44" y="27" width="16" height="9" rx="1.5"/>
    <rect x="44" y="42" width="16" height="9" rx="1.5"/>
  </g>

  <!--
    The one node carrying a state. It sits in the middle cabinet and in the
    middle row so it reads as "one cell among many" rather than as a corner
    accent, which is the whole claim of the panel.
  -->
  <rect x="24" y="27" width="16" height="9" rx="1.5" fill="#56a64b"/>
</svg>
